<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tecnologías de la Información</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <form id="registroForm">
            <h2>Formulario de Registro</h2>

            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Mínimo 3 caracteres">
                <span class="error-msg" id="error-nombre">El nombre debe tener al menos 3 caracteres.</span>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                <span class="error-msg" id="error-email">Formato de correo inválido.</span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres, 1 número y 1 especial">
                <span class="error-msg" id="error-password">Mínimo 8 caracteres (debe incluir número y carácter especial).</span>
            </div>

            <div class="form-group">
                <label for="confirmar">Confirmar Contraseña:</label>
                <input type="password" id="confirmar" name="confirmar">
                <span class="error-msg" id="error-confirmar">Las contraseñas no coinciden.</span>
            </div>

            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad">
                <span class="error-msg" id="error-edad">Debes ser mayor de 18 años.</span>
            </div>

            <div class="buttons">
                <button type="submit" id="btnEnviar" disabled>Enviar Registro</button>
                <button type="reset" id="btnReiniciar">Reiniciar</button>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
