{% extends "base.html" %}
{% block content %}
<h2>Gestión de Servicios GAD</h2>

<form action="/crear_servicio" method="POST">
    <input type="text" name="nombre" placeholder="Nombre del trámite" required>
    <input type="number" step="0.01" name="costo" placeholder="Costo" required>
    <select name="estado">
        <option value="Activo">Activo</option>
        <option value="Inactivo">Inactivo</option>
    </select>
    <button type="submit">Agregar</button>
</form>

<hr>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Costo</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for s in servicios %}
        <tr>
            <td>{{ s.id }}</td>
            <td>{{ s.nombre }}</td>
            <td>${{ s.costo }}</td>
            <td>{{ s.estado }}</td>
            <td>
                <a href="{{ url_for('eliminar', id=s.id) }}">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
