{% extends "base.html" %}

{% block content %}
<div style="text-align: center; font-family: Arial, sans-serif;">
    <h2 style="color: #2980b9; margin-bottom: 20px;">Gestión de Servicios GAD Santa Rosa</h2>

    <div style="margin-bottom: 30px; padding: 20px; border: 2px solid #2980b9; border-radius: 10px; display: inline-block; background-color: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <form action="/crear_servicio" method="POST">
            <input type="text" name="nombre" placeholder="Nombre del trámite" required 
                   style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-right: 10px;">
            
            <input type="text" name="costo" placeholder="Cédula del Ciudadano" required 
                   style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-right: 10px;">
            
            <select name="estado" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-right: 10px;">
                <option value="Pendiente">Pendiente</option>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>
            
            <button type="submit" style="background-color: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                + Agregar
            </button>
        </form>
    </div>

    <table style="width: 100%; border-collapse: collapse; background-color: #ffffff; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: 1px solid #2980b9;">
        <thead>
            <tr style="background-color: #2980b9; color: #ffffff;">
                <th style="padding: 12px; border: 1px solid #ffffff;">ID</th>
                <th style="padding: 12px; border: 1px solid #ffffff;">Nombre del Trámite</th>
                <th style="padding: 12px; border: 1px solid #ffffff;">Cédula Relacionada</th>
                <th style="padding: 12px; border: 1px solid #ffffff;">Estado</th>
                <th style="padding: 12px; border: 1px solid #ffffff;">Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for t in lista_tramites %}
            <tr style="border-bottom: 1px solid #dddddd; text-align: center;">
                <td style="padding: 12px; color: #2c3e50;">{{ t[0] }}</td> <td style="padding: 12px; color: #2c3e50;">{{ t[1] }}</td> <td style="padding: 12px; color: #2c3e50;">{{ t[4] }}</td> <td style="padding: 12px;">
                    <span style="padding: 5px 10px; border-radius: 15px; color: white; font-size: 0.9em; background-color: {% if t[3] == 'Activo' %}#27ae60{% elif t[3] == 'Pendiente' %}#f39c12{% else %}#e74c3c{% endif %};">
                        {{ t[3] }}
                    </span>
                </td>
                <td style="padding: 12px;">
                    <a href="{{ url_for('editar_tramite', id=t[0]) }}" 
                       style="color: #2980b9; text-decoration: none; font-weight: bold; margin-right: 10px;">Editar</a>
                    <span style="color: #ccc;">|</span>
                    <a href="{{ url_for('eliminar_tramite', id=t[0]) }}" 
                       onclick="return confirm('¿Estás seguro de eliminar este registro?')" 
                       style="color: #e74c3c; text-decoration: none; font-weight: bold; margin-left: 10px;">
                       Eliminar
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
