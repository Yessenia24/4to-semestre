{% extends "base.html" %}

{% block content %}
<h2>Gestión de Usuarios - Sistema GAD</h2>

<div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc;">
    <h3>Registrar Nuevo Usuario</h3>
    <form action="/crear_usuario" method="POST">
        <input type="text" name="nombre" placeholder="Nombre completo" required>
        <input type="email" name="mail" placeholder="Correo electrónico" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit">Registrar Usuario</button>
    </form>
</div>

<hr>

<h3>Lista de Usuarios Registrados</h3>
<table border="1" style="width:100%; border-collapse: collapse;">
    <thead style="background-color: #2c3e50; color: white;">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for u in usuarios %}
        <tr>
            <td>{{ u[0] }}</td> <td>{{ u[1] }}</td> <td>{{ u[2] }}</td> <td>
                <a href="/eliminar_usuario/{{ u[0] }}" onclick="return confirm('¿Eliminar usuario?')">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
