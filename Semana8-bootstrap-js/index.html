<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Proyecto Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">MiTienda</a>
            <div class="navbar-nav">
                <a class="nav-link" href="#inicio">Inicio</a>
                <a class="nav-link" href="#productos">Productos</a>
                <a class="nav-link" href="#contacto">Contacto</a>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        
        <div id="miCarrusel" class="carousel slide mb-5" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://via.placeholder.com/800x300?text=Producto+1" class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="https://via.placeholder.com/800x300?text=Producto+2" class="d-block w-100" alt="...">
                </div>
            </div>
        </div>

        <div class="text-center mb-5">
            <button id="btnAlerta" class="btn btn-primary">Haz clic aquí</button>
        </div>

        <section id="contacto" class="row justify-content-center">
            <div class="col-md-6">
                <form id="formContacto" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mensaje</label>
                        <textarea id="mensaje" class="form-control" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
